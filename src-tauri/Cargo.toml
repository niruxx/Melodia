[package]
name = "tunebox"
version = "0.1.0"
description = "A cross-platform YouTube Music client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tunebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "rt", "sync", "macros", "net", "time"] }
discord-rich-presence = "0.2"
mdns-sd = "0.20"
hostname = "0.4"
rodio = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
walkdir = "2"
lofty = "0.24"
base64 = "0.22"
# Album-art colour extraction. Only the codecs artwork actually ships as are
# enabled — default features pull in a much larger format matrix than needed.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rustfft = "6"
tauri-plugin-global-shortcut = "2.3.2"
url = "2.5.8"

